# Caccia: scheda madre DDR3 quad channel con CPU, sotto 100 euro spedita, dalla UE.

nome: mobo-ddr3-quad
attiva: true
ogni_minuti: 180

# --- Parametri eBay: tutto cio' che eBay filtra da solo -------------------
ebay:
  marketplaces: [EBAY_IT, EBAY_DE, EBAY_FR, EBAY_ES]
  valuta: EUR
  prezzo_max: 100
  spedizione_inclusa: true      # il budget vale su prezzo + spedizione (controllo locale)
  spedizione_ignota: tieni      # tieni | scarta gli annunci senza costo di spedizione noto
  regione: EUROPEAN_UNION       # oggetto situato nella UE
  consegna_paese: IT            # spedisce in Italia
  condizioni: [usato, ricondizionato]
  ordinamento: newlyListed
  max_risultati_per_query: 100
  feedback_minimo: 97

# --- Per Palantir: cosa cercare, solo gli elementi chiave ------------------
ricerca: >
  Scheda madre con memoria DDR3 quad channel, venduta con la CPU montata o inclusa.
  Meglio se c'e' anche la RAM.

# Query aggiunte a mano a quelle generate (opzionale)
query_extra:
  - X79 mainboard CPU
  - LGA2011 motherboard CPU bundle

# Scarto sicuro sul titolo, prima di qualsiasi LLM
parole_escluse: [solo cpu, only cpu, nur cpu, cpu only, solo scheda madre, board only, nur mainboard]

screening: true               # passaggio di Palantir sui titoli

# --- Per Groq: requisiti avanzati da verificare sul dettaglio -------------
requisiti_avanzati: |
  - Il bundle deve includere scheda madre E CPU. La RAM e' un plus, non un requisito.
  - La piattaforma deve supportare DDR3 in quad channel (per esempio X79 / C602 / LGA2011, o schede X99 in versione DDR3).
  - La CPU inclusa deve avere TDP inferiore a 100 W.
  - La CPU deve avere PassMark CPU Mark single thread di almeno 1845 e multi thread di almeno 3001.
  - Identifica il modello esatto di CPU: se l'annuncio non lo dice, il requisito prestazionale e' "incerto".
# Per non dipendere dalla memoria del modello sui valori PassMark,
# compila dati/cpu_riferimento.csv e togli il commento qui sotto.
# dati_riferimento: ../dati/cpu_riferimento.csv
