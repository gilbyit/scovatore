nome: lego-lotti-sfusi
attiva: true
ogni_minuti: 90
fonti: [ebay, vinted, subito]   # ricerche attive; i prezzi di Vinted e Subito seguono prezzo_max di ebay

ebay:
  marketplaces: [EBAY_IT, EBAY_DE, EBAY_FR, EBAY_ES]
  valuta: EUR
  prezzo_max: 50
  spedizione_inclusa: true
  spedizione_ignota: scarta      # su lotti pesanti la spedizione decide il prezzo reale
  regione: EUROPEAN_UNION
  consegna_paese: IT
  ordinamento: newlyListed
  max_risultati_per_query: 100

ricerca: >
  Lotti di mattoncini LEGO originali sfusi venduti a peso o a chilo
  (lotto LEGO kg, LEGO sfusi, Konvolut LEGO kg, LEGO Steine Kilo,
  lot LEGO vrac kg, lote LEGO kilos, bulk LEGO). Solo LEGO originale, un
  lotto misto di pezzi diversi, non set completi, non minifigure singole,
  non pezzi singoli, non Duplo. Vanno bene anche LEGO vintage anni 70 e 80
  e i mattoncini Minitalia. Non interessano le vendite di "un chilo preso
  a caso" da un lotto piu' grande (random, mystery, grab bag, Zufall,
  Wundertuete): il lotto deve essere quello descritto e fotografato.

query_extra:
  - "lego lotto sfuso kg"
  - "lego konvolut kg"
  - "lego vrac kg"
  - "lego lote kilos"
  - "lego vintage lotto kg"
  - "lego anni 70 80 lotto"
  - "minitalia lotto kg"

max_query_per_lingua: 6

parole_escluse:
  - cobi
  - "mega bloks"
  - megabloks
  - lepin
  - sluban
  - nachbau
  - random
  - casuale
  - casuali
  - mystery
  - zufällig
  - zufällige
  - zufaellig
  - wundertüte
  - "grab bag"
  - aleatorio
  - aleatorios
  - imitazione
  - ninjago
  - bionicle
  - "hero factory"
  - playmobil

screening: true

requisiti_avanzati: |
  Requisiti eliminatori (altrimenti non_conforme):
  - Solo LEGO originale. Se il lotto contiene mattoncini compatibili, cloni, Mega Bloks, Cobi o altro misto, non_conforme. Se non e' chiaro (foto assenti, testo vago), incerto con segnale di rischio.
  - Eccezione: LEGO vintage anni 70 e 80 e mattoncini Minitalia sono accettati e non vanno trattati come compatibili o cloni, anche se l'annuncio li descrive come "compatibili LEGO" o "tipo LEGO".
  - Non e' accettabile la vendita di una porzione presa a caso da un lotto piu' grande: annunci con quantita a scelta (1 kg, 2 kg, 5 kg dallo stesso mucchio), foto di uno scatolone enorme con la dicitura "1 kg random / a caso / mystery / estratto dal mucchio", varianti di peso dello stesso annuncio. In questi casi non_conforme. Il lotto deve essere definito: il contenuto fotografato e' quello che arriva.
  - Totale (prezzo + spedizione) al massimo 50 EUR.
  - Il peso del lotto deve essere dichiarato (titolo, descrizione o specifiche). Se non e' dichiarato e non si deduce dalle foto, esito incerto e punteggio basso.
  - Prezzo al chilo, calcolato sul totale con spedizione, al massimo 12 EUR/kg. Sotto 10 EUR/kg e' ideale. Sopra 12 EUR/kg non_conforme.
  - Duplo e Primo escluse: se il lotto e' prevalentemente Duplo o Primo, non_conforme. Se ne contiene solo qualche pezzo in mezzo ai LEGO normali, penalizzare e segnalare.
  - Non e' un lotto a tema esclusivamente poco appetibile: Ninjago, Bionicle, Hero Factory, Legends of Chima, Mixels, Belville.

  Punteggio (su 100), in ordine di peso:
  - Prezzo al chilo: circa 35 punti. 10 EUR/kg o meno prende il massimo, 12 EUR/kg circa meta.
  - Qualita del contenuto: circa 35 punti. Favorire mattoncini e plate normali, Technic, minifigure, temi ricercati (Star Wars, Castle, Space, Harry Potter, Pirates, City, Creator, Ideas, Modular), LEGO vintage anni 70 e 80 (Classic Space, Castle, Town, Legoland) e Minitalia, e pezzi in colori utili. Penalizzare lotti dominati da pezzi ingombranti e poco utili (basi grandi, scafi, ruote e pezzi sagomati ripetuti), pezzi Duplo mescolati, piante o accessori in eccesso.
  - Stato dei pezzi: circa 20 punti. Puliti, non incollati, non rotti, senza segni di masticazione o muffa, senza odore di fumo, senza adesivi rovinati. Le foto devono mostrare il contenuto reale.
  - Affidabilita del venditore e assenza di segnali di rischio: circa 10 punti.

  Segnali di rischio da riportare:
  - Foto stock o foto di un solo set che non rappresentano il lotto.
  - Peso approssimativo o "circa", con foto che mostrano molto meno materiale.
  - Pezzi sporchi, appiccicosi, incollati, con muffa o odore di fumo.
  - Presenza di altri marchi insieme ai LEGO.
  - Asta: il prezzo e' l'offerta corrente e puo' salire oltre 50 EUR, segnalarlo e abbassare il punteggio.
  - Spedizione dal paese che porta il totale vicino al tetto.

  Nella sintesi indicare: peso dichiarato, totale con spedizione, EUR/kg calcolato, temi riconoscibili dal titolo e dalle foto, numero di minifigure se dichiarato. Domande utili per il venditore: il lotto e' tutto LEGO originale? Il peso e' pesato o stimato? Ci sono set riconoscibili? I pezzi sono lavati?
