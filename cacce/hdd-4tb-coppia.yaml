nome: hdd-4tb-coppia
attiva: true
ogni_minuti: 180

ebay:
  marketplaces: [EBAY_IT, EBAY_DE, EBAY_FR, EBAY_ES]
  valuta: EUR
  prezzo_max: 95                 # prezzo articolo, SENZA spedizione; la soglia vera (singolo/coppia) la applica Groq
  spedizione_inclusa: false      # il budget sul prezzo NON include la spedizione: il tetto spedizione e' separato (vedi requisiti_avanzati)
  spedizione_ignota: scarta      # serve conoscere il costo di spedizione per verificare che sia <= 10 EUR
  regione: EUROPEAN_UNION
  consegna_paese: IT
  ordinamento: newlyListed
  max_risultati_per_query: 100

ricerca: >
  Hard disk da 3,5 pollici, interfaccia SATA, capacita' 4 TB (4000 GB),
  usati, venduti singoli o in coppia (2 pezzi nello stesso annuncio).
  Marche affidabili: Western Digital, Seagate, Toshiba, HGST/Hitachi.
  Non interessano hard disk esterni USB/portatili, dischi da 2,5 pollici,
  SSD, NAS completi (l'apparecchio, non il disco), capacita' diverse da
  4 TB.

query_extra:
  - "hdd 4tb coppia"
  - "2x hdd 4tb"
  - "hard disk 4tb crystaldiskinfo"
  - "hdd 4tb ore utilizzo"

max_query_per_lingua: 5

parole_escluse:
  - ssd
  - esterno
  - "box esterno"
  - "custodia esterna"
  - portatile
  - notebook
  - "2.5"
  - nas          # esclude gli apparecchi NAS completi, non i dischi "nas-rated"

screening: true

requisiti_avanzati: |
  Requisiti eliminatori (altrimenti esito non_conforme):
  - Deve essere un hard disk 3,5" SATA da 4 TB. Capacita' diverse (2 TB, 3 TB, 6 TB...) non vanno bene. Se la capacita' non e' chiara, incerto.
  - I prezzi sotto sono sul prezzo dell'articolo, SENZA spedizione. La spedizione si valuta a parte e deve essere al massimo 10 EUR; se supera 10 EUR, non_conforme anche se il prezzo dell'articolo e' in soglia.
  - Caso A, disco singolo: prezzo articolo massimo 40 EUR. Tollerabile fino a 48 EUR solo se l'annuncio accetta offerte al ribasso (Best Offer).
  - Caso B, coppia (2 dischi nello stesso annuncio): prezzo articolo massimo 80 EUR (= 40 EUR a disco). Tollerabile fino a 95 EUR con Best Offer.
  - Deve essere un disco CMR (registrazione convenzionale), non SMR. Modelli noti SMR da evitare o penalizzare pesantemente se dichiarati senza smentita: WD Red SMR (sigla WD40EFAX), Seagate Barracuda ST4000DM004/DM005, Toshiba P300 4TB (alcune revisioni). Modelli CMR affidabili da preferire: Seagate IronWolf, WD Red Plus/Pro, HGST Deskstar/Ultrastar, Seagate Desktop HDD ST4000DM000/DM001 (vecchia generazione, CMR). Se non si riesce a determinare CMR/SMR dal modello o dalla descrizione, non scartare ma segnalare come incerto e penalizzare leggermente.

  Punteggio (su 100), in ordine di peso:
  - Prove di salute/usura dichiarate: ore di utilizzo (Power-On Hours), report o screenshot CrystalDiskInfo, SMART pulito, "0 settori riallocati": 35 punti. E' la priorita' principale: un disco con ore basse e report mostrato vale molto piu' di uno senza alcuna informazione.
  - Prezzo articolo rispetto al tetto di fascia (singolo o coppia) e spedizione entro 10 EUR: 25 punti. Spedizione sopra i 10 EUR azzera questa voce (vedi eliminatori).
  - CMR confermato e marca/modello affidabile (vedi sopra): 20 punti.
  - Vendita in coppia nello stesso annuncio: 10 punti bonus (un singolo a prezzo giusto resta valido, ma la coppia e' preferita).
  - Affidabilita' del venditore, foto chiare del disco (etichetta leggibile), assenza di segnali di rischio: 10 punti.

  Segnali di rischio da riportare: rumori anomali dichiarati (click, grattamenti), settori riallocati o pendenti riportati, disco "per ricambi" o "non testato", foto generiche o stock, etichetta non leggibile che impedisce di verificare il modello, provenienza da server/data center senza indicazione delle ore (rischio ore altissime non dichiarate).

  Nella sintesi indicare: modello esatto e sigla, CMR o SMR, ore di utilizzo se note e fonte (screenshot, dichiarazione venditore, dedotta dal modello), singolo o coppia, prezzo articolo e costo di spedizione separati. Domande utili per il venditore: puo' mostrare uno screenshot di CrystalDiskInfo o delle SMART? Quante ore di utilizzo ha il disco? Da dove proviene (PC desktop, NAS, server)?
