nome: combo-cpu-mb-potente
attiva: false
ogni_minuti: 120
fonti: [ebay, vinted, subito]   # ricerche attive; i prezzi di Vinted e Subito seguono prezzo_max di ebay

ebay:
  marketplaces: [EBAY_IT, EBAY_DE, EBAY_FR, EBAY_ES]
  valuta: EUR
  prezzo_max: 50
  spedizione_inclusa: true
  spedizione_ignota: tieni
  regione: EUROPEAN_UNION
  consegna_paese: IT
  condizioni: [nuovo, aperto, ricondizionato, usato]   # niente "guasto"
  ordinamento: newlyListed
  max_risultati_per_query: 100

ricerca: >
  Combo scheda madre + processore (bundle, kit, combo, Mainboard CPU Set,
  carte mere avec processeur) usati o nuovi, il piu' potenti possibile.
  Piattaforme di interesse: LGA2011 (X79) con Xeon E5-2600 v1/v2 (E5-2670,
  E5-2680, E5-2650 v2, E5-2690 v2...), LGA2011-3 (X99) con Xeon E5-2600 v3/v4
  (E5-2666 v3, E5-2670 v3, E5-2680 v3, E5-2680 v4...), LGA1150 e LGA1155 con
  Core i7 o Xeon E3, AM4 con Ryzen, AM3+ con FX-8350. Meglio se il kit
  include anche la RAM (DDR3 o DDR4, anche ECC REG). Solo kit con CPU e
  scheda madre insieme: niente CPU sole, niente schede madri sole, niente
  PC completi o portatili.

max_query_per_lingua: 6

parole_escluse:
  - laptop
  - notebook
  - portatile
  - defekt
  - bastler
  - guasto
  - rotto
  - "senza cpu"
  - "ohne cpu"
  - "no cpu"

screening: true

# Consigliato: tabella con PassMark verificati per le CPU plausibili delle
# piattaforme sopra (Xeon E5 v1-v4, i7 3770/4770, E3-12xx, Ryzen, FX).
# Poi togli il commento. Il percorso e' relativo a questo file.
# dati_riferimento: ../dati/cpu_riferimento.csv

requisiti_avanzati: |
  Requisiti eliminatori (altrimenti esito non_conforme):
  - L'annuncio deve contenere sia CPU sia scheda madre. CPU sola o scheda madre sola non vanno bene.
  - Totale con spedizione al massimo 50 EUR.
  - La CPU deve essere compatibile con il socket e il chipset della scheda madre (es. Xeon E5 v3/v4 solo su LGA2011-3, E5 v1/v2 solo su LGA2011). Se l'incompatibilita' e' evidente, non_conforme; se non e' chiaro quale CPU sia inclusa, incerto.
  - Non deve essere dichiarato guasto, non funzionante o venduto per ricambi.

  Cosa determina il punteggio (in ordine di peso):
  - Prestazioni multi-thread della CPU (PassMark CPU Mark o equivalente): peso maggiore, circa 50 punti su 100. Piu' alto e' meglio.
  - Prestazioni single-thread: circa 15 punti. Non penalizzare troppo Xeon a molti core con clock basso, ma un single-thread molto scarso conta.
  - RAM inclusa: circa 20 punti. Contano quantita' e tipo (DDR4 meglio di DDR3, 32 GB meglio di 8 GB). Verificare che la RAM sia utilizzabile sulla scheda (ECC REG solo se la scheda la supporta). Senza RAM, zero punti su questa voce.
  - Completezza e condizione: circa 10 punti (mascherina I/O, dissipatore, testato dal venditore, resi accettati).
  - Affidabilita' del venditore e assenza di segnali di rischio: circa 5 punti.

  Segnali di rischio da riportare:
  - CPU contraffatte o rietichettate (E5-2670 e simili a prezzo troppo basso, prezzo incoerente col modello).
  - Engineering sample (ES/QS) o CPU "OEM non testata".
  - Scheda madre di marca sconosciuta o con BIOS modificato, senza indicazione di testing.
  - Pin piegati o mancanti, foto stock, descrizione generica.
  - Kit che richiede RAM ECC REG ma senza RAM inclusa (il costo reale sale).
  - Spedizione da fuori UE con possibili dazi o tempi lunghi.

  Nella sintesi indicare: modello di CPU e di scheda madre, RAM inclusa, totale con spedizione e una stima del PassMark multi-thread con la fonte (annuncio, riferimento o conoscenza). Se il PassMark viene solo ricordato dal modello, marcare la fonte come conoscenza e non usare un punteggio alto senza cautela.
  Domande utili per il venditore: CPU e scheda testate insieme? Quale RAM esatta? Include dissipatore e mascherina? Sono accettati resi?
