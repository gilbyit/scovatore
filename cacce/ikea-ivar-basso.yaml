nome: ikea-ivar-basso
attiva: true
ogni_minuti: 180

ebay:
  marketplaces: [EBAY_IT]
  valuta: EUR
  prezzo_max: 150                 # tetto largo: puo' essere una combinazione grande, valutata poi a rapporto qualita/prezzo
  spedizione_inclusa: true
  spedizione_ignota: tieni
  regione: EUROPEAN_UNION
  consegna_paese: IT
  ordinamento: newlyListed
  max_risultati_per_query: 100

ricerca: >
  Scaffali componibili IKEA IVAR in pino massiccio, versione bassa: montanti
  laterali da 124 cm di altezza (o comunque chiaramente bassi, non i
  montanti alti da 179 o 226 cm), con i relativi ripiani, eventualmente
  cassetti o ante IVAR. Va bene anche una combinazione piu' grande con piu'
  montanti e ripiani del necessario, l'importante e' che la struttura
  complessiva sia bassa. Non interessano montanti alti standalone da 179 o
  226 cm, e non interessano mobili di altre linee IKEA anche se in pino
  grezzo (Rast, Tarva...).

query_extra:
  - "ikea ivar basso"
  - "ikea ivar 124"
  - "ikea ivar montanti bassi"

max_query_per_lingua: 4

parole_escluse:
  - rast
  - tarva
  - hemnes
  - rustik

screening: true

requisiti_avanzati: |
  Requisiti eliminatori (altrimenti esito non_conforme):
  - Deve essere IKEA IVAR, non un'imitazione o un altro scaffale in legno generico.
  - La struttura deve essere bassa: montanti da circa 124 cm di altezza (o piu' bassi), non i montanti standard da 179 o 226 cm. Se l'altezza non e' dichiarata ma le foto mostrano chiaramente uno scaffale basso (a livello di comodino/credenza, non a soffitto), va bene comunque; se e' ambiguo, incerto.
  - Deve essere una struttura completa vendibile (almeno una coppia di montanti con i relativi ripiani), non un ripiano sfuso o un solo montante spaiato.

  Punteggio (su 100):
  - Convenienza rispetto al prezzo nuovo IKEA (indicativamente intorno a 130 EUR per una struttura bassa base completa di ripiani): 45 punti. Piu' il prezzo totale scende sotto quella soglia, meglio e'; per combinazioni piu' grandi del normale, valutare il prezzo in proporzione al numero di montanti e ripiani inclusi, non solo il totale assoluto.
  - Quantita' e completezza (numero di montanti, ripiani, presenza di cassetti o ante originali IVAR): 30 punti. Una combinazione piu' grande del necessario e' un vantaggio, non un difetto, perche' il pezzo in eccesso e' rivendibile.
  - Stato del legno (non incrinato, non tarlato, non eccessivamente segnato, viti e ferramenta presenti): 20 punti.
  - Affidabilita' del venditore e chiarezza delle foto: 5 punti.

  Segnali di rischio da riportare: legno tarlato o ammuffito, montanti storti o incurvati (difetto noto di questa linea), ferramenta mancante (crociera di sostegno, viti), foto generiche o stock, prezzo sospettosamente alto per pezzi comuni.

  Nella sintesi indicare: numero e altezza dei montanti, numero di ripiani, eventuali cassetti/ante, prezzo totale con spedizione, e una stima se conviene rispetto al prezzo nuovo di circa 130 EUR per la configurazione base. Domande utili per il venditore: quanti montanti e ripiani esatti include il lotto? Sono tutti della stessa altezza? Ci sono la crociera di sostegno e le viti?
